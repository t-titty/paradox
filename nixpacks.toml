# Pin Node 20 (root package.json engines requires >=20). openssl is
# required by Prisma's query engine at runtime.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
# Force devDeps even when NODE_ENV=production — we need tsc, prisma CLI,
# and tsx for build + seed + migrate at deploy time.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
